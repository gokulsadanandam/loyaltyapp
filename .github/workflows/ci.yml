name: CI / Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a production deploy half-way; cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Containers the app and tests don't need; makes `supabase start` much faster.
  SUPABASE_EXCLUDE: studio,edge-runtime,logflare,vector,realtime,supavisor,imgproxy

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  database:
    name: Migrations, pgTAP, schema lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start Supabase (applies migrations + seed)
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: pgTAP
        run: npx supabase test db
      - name: Schema lint (plpgsql_check)
        run: npx supabase db lint --schema public,private --level warning --fail-on warning
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.ts
          npx prettier --stdin-filepath src/lib/database.types.ts < /tmp/database.types.ts > /tmp/formatted.ts
          if ! diff -u src/lib/database.types.ts /tmp/formatted.ts; then
            echo "::error file=src/lib/database.types.ts::Out of date. Run: npm run db:types"
            exit 1
          fi

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start Supabase
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: Write .env.local from the local stack
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export SB_/')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SB_API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SB_PUBLISHABLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "SUPABASE_SECRET_KEY=$SB_SECRET_KEY"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "QR_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
            echo "EMAIL_FROM=Loyalty CI <ci@loyalty.test>"
          } > .env.local
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build and run E2E
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [checks, database, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment secrets
        id: gate
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy skipped::Missing secrets:$missing. See DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'

      # 1) Database first. Migrations are additive, so the running app keeps working.
      #    Never --include-seed: seed.sql creates test users with known passwords.
      - name: Apply database migrations
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      # 2) Then the app. Runtime env vars live in the Vercel project (see DEPLOYMENT.md).
      - name: Deploy to Vercel
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          url=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
